<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Reportes Power BI – Sudata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 240px;
      --accent: #5CB85C;
      --accent-hover: #4A9A4A;
      --bg-dark: #2E2F4F;
      --bg-darker: #23243D;
      --text: #FFFFFF;
      --text-muted: #DADADA;
      --border: #3D3E60;
      --active-bg: #5CB85C;
      --active-text: #FFFFFF;
      --surface: #F5F5F5;
    }

    body {
      display: flex;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-w);
      background: var(--bg-darker);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
    }

    .logo {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo span {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.5px;
      color: var(--accent);
    }

    .section-label {
      padding: 20px 16px 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    #report-list { list-style: none; flex: 1; overflow-y: auto; }

    #report-list li {
      margin: 2px 8px;
      border-radius: 6px;
      overflow: hidden;
    }

    #report-list li a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 13px;
      border-radius: 6px;
      transition: background .15s, color .15s;
      cursor: pointer;
    }
    #report-list li a:hover { background: var(--border); color: var(--text); }
    #report-list li.active a {
      background: var(--active-bg);
      color: var(--active-text);
      font-weight: 600;
    }
    #report-list li a svg { flex-shrink: 0; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      background: var(--bg-darker);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    #report-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(92,184,92,.15);
      border: 1px solid rgba(92,184,92,.4);
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
    }
    #report-badge.show { display: flex; }

    /* ── Filter bar ── */
    #filter-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #filter-bar.show { display: flex; }
    #filter-bar label {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    #filter-input {
      flex: 1;
      max-width: 260px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-darker);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    #filter-input:focus { border-color: var(--accent); }
    #filter-btn {
      padding: 6px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    #filter-btn:hover { background: var(--accent-hover); }

    /* ── Report container ── */
    #report-container {
      flex: 1;
      position: relative;
      background: var(--surface);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #DADADA;
      font-size: 14px;
      background: var(--surface);
    }
    .placeholder svg { opacity: .3; }

    .spinner-wrap {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      flex-direction: column;
      gap: 10px;
      color: #666;
      font-size: 13px;
      z-index: 10;
    }
    .spinner-wrap.show { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #DADADA;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      display: none;
      position: absolute;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #fee; border: 1px solid #fcc;
      color: #900; padding: 10px 16px;
      border-radius: 6px; font-size: 13px;
      max-width: 480px; text-align: center;
      z-index: 20;
    }
  </style>
</head>
<body>

<aside>
  <div class="logo">
    <span>&#9646; Sudata</span>
  </div>
  <div class="section-label">Reportes</div>
  <ul id="report-list">
    <li><a><em style="color:var(--text-muted);font-size:12px">Cargando…</em></a></li>
  </ul>
  <div class="sidebar-footer">Powered by Sudata</div>
</aside>

<main>
  <header>
    <h1>Reportes Power BI</h1>
    <span id="report-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="12" width="4" height="10"/><rect x="10" y="6" width="4" height="16"/><rect x="18" y="2" width="4" height="20"/></svg>
      <span id="badge-text"></span>
    </span>
  </header>

  <div id="filter-bar">
    <label for="filter-input">Filtro:</label>
    <input type="text" id="filter-input" placeholder="Ej: USA" />
    <button id="filter-btn">Aplicar</button>
  </div>

  <div id="report-container">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="#DADADA"><rect x="2" y="12" width="4" height="10"/><rect x="10" y="6" width="4" height="16"/><rect x="18" y="2" width="4" height="20"/></svg>
      Seleccioná un reporte del menú lateral
    </div>
    <div class="spinner-wrap" id="spinner">
      <div class="spinner"></div>
      Cargando reporte…
    </div>
    <div id="error-msg"></div>
  </div>
</main>

<script>
  const models = window['powerbi-client']?.models;
  let currentReport = null;
  let currentReportId = null;
  let currentFilterable = false;

  // Cargar lista de reportes
  fetch('/api/reports')
    .then(r => r.json())
    .then(data => {
      const ul = document.getElementById('report-list');
      ul.innerHTML = '';
      data.reports.forEach(rep => {
        const li = document.createElement('li');
        li.innerHTML = `<a>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="12" width="4" height="10"/><rect x="10" y="6" width="4" height="16"/><rect x="18" y="2" width="4" height="20"/>
          </svg>
          ${rep.name}
        </a>`;
        li.querySelector('a').onclick = () => {
          currentFilterable = !!rep.filterable;
          loadReport(rep.id, rep.name, li);
        };
        ul.appendChild(li);
      });
    })
    .catch(() => {
      document.getElementById('report-list').innerHTML =
        '<li><a style="color:#e55">Error al cargar reportes</a></li>';
    });

  // Aplicar filtro
  document.getElementById('filter-btn').addEventListener('click', () => {
    if (currentReportId !== null) {
      const activeLi = document.querySelector('#report-list li.active');
      loadReport(currentReportId, document.getElementById('badge-text').textContent, activeLi);
    }
  });
  document.getElementById('filter-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('filter-btn').click();
  });

  function loadReport(id, name, liEl) {
    currentReportId = id;

    // Marcar activo
    document.querySelectorAll('#report-list li').forEach(l => l.classList.remove('active'));
    if (liEl) liEl.classList.add('active');

    // Badge
    document.getElementById('badge-text').textContent = name;
    document.getElementById('report-badge').classList.add('show');

    // Barra de filtro: visible sólo si el reporte es filtrable
    const filterBar = document.getElementById('filter-bar');
    if (currentFilterable) {
      filterBar.classList.add('show');
    } else {
      filterBar.classList.remove('show');
      document.getElementById('filter-input').value = '';
    }

    // Spinner
    const spinner = document.getElementById('spinner');
    const errorMsg = document.getElementById('error-msg');
    spinner.classList.add('show');
    errorMsg.style.display = 'none';
    document.getElementById('placeholder').style.display = 'none';

    // Limpiar reporte anterior
    if (currentReport) {
      powerbi.reset(document.getElementById('report-container'));
      currentReport = null;
    }

    const filterValue = currentFilterable ? document.getElementById('filter-input').value.trim() : '';
    const url = `/api/report-config?report_id=${id}` + (filterValue ? `&filter=${encodeURIComponent(filterValue)}` : '');

    fetch(url)
      .then(r => r.json())
      .then(cfg => {
        const container = document.getElementById('report-container');
        const config = {
          type: 'report',
          tokenType: models?.TokenType?.Aad ?? 0,
          accessToken: cfg.accessToken,
          embedUrl: cfg.embedUrl,
          id: cfg.reportId,
          settings: {
            panes: { filters: { visible: false }, pageNavigation: { visible: true } },
            bars: { statusBar: { visible: true } }
          }
        };
        currentReport = powerbi.embed(container, config);
        currentReport.on('loaded', () => spinner.classList.remove('show'));
        currentReport.on('error', e => {
          spinner.classList.remove('show');
          errorMsg.textContent = 'Error: ' + (e.detail?.message || JSON.stringify(e.detail));
          errorMsg.style.display = 'block';
        });
      })
      .catch(err => {
        spinner.classList.remove('show');
        errorMsg.textContent = 'Error al obtener configuración: ' + err.message;
        errorMsg.style.display = 'block';
      });
  }
</script>
</body>
</html>
