<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Reportes Power BI – Sudata</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/powerbi-client@2.23.1/dist/powerbi.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 240px;
      --accent: #5CB85C;
      --accent-hover: #4A9A4A;
      --bg-dark: #2E2F4F;
      --bg-darker: #23243D;
      --text: #FFFFFF;
      --text-muted: #DADADA;
      --border: #3D3E60;
      --active-bg: #5CB85C;
      --active-text: #FFFFFF;
      --surface: #F5F5F5;
    }

    body {
      display: flex;
      height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Sidebar ── */
    aside {
      width: var(--sidebar-w);
      background: var(--bg-darker);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
    }

    .logo {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo span {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -.5px;
      color: var(--accent);
    }

    .section-label {
      padding: 20px 16px 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    #report-list { list-style: none; flex: 1; overflow-y: auto; }

    #report-list li {
      margin: 2px 8px;
      border-radius: 6px;
      overflow: hidden;
    }

    #report-list li a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 13px;
      border-radius: 6px;
      transition: background .15s, color .15s;
      cursor: pointer;
    }
    #report-list li a:hover { background: var(--border); color: var(--text); }
    #report-list li.active a {
      background: var(--active-bg);
      color: var(--active-text);
      font-weight: 600;
    }
    #report-list li a svg { flex-shrink: 0; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      background: var(--bg-darker);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    #report-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(92,184,92,.15);
      border: 1px solid rgba(92,184,92,.4);
      color: var(--accent);
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 20px;
    }
    #report-badge.show { display: flex; }

    /* ── Acciones del reporte (restablecer / actualizar visuales) ── */
    #actions {
      display: none;
      margin-left: auto;
      gap: 8px;
    }
    #actions.show { display: flex; }
    .action-btn {
      padding: 5px 14px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .action-btn:hover { background: var(--border); border-color: var(--accent); }
    .action-btn:disabled { opacity: .5; cursor: default; }
    .action-btn[hidden] { display: none; }

    #info-msg {
      display: none;
      position: absolute;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #efe; border: 1px solid #beb;
      color: #264; padding: 10px 16px;
      border-radius: 6px; font-size: 13px;
      z-index: 20;
    }

    /* ── Filter bar ── */
    #filter-bar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 20px;
      background: var(--bg-dark);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #filter-bar.show { display: flex; }
    #filter-bar label {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    #filter-input {
      flex: 1;
      max-width: 260px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg-darker);
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color .15s;
    }
    #filter-input:focus { border-color: var(--accent); }
    #filter-btn {
      padding: 6px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    #filter-btn:hover { background: var(--accent-hover); }

    /* ── Report container ── */
    #report-container {
      flex: 1;
      position: relative;
      background: var(--surface);
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #DADADA;
      font-size: 14px;
      background: var(--surface);
    }
    .placeholder svg { opacity: .3; }

    .spinner-wrap {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      flex-direction: column;
      gap: 10px;
      color: #666;
      font-size: 13px;
      z-index: 10;
    }
    .spinner-wrap.show { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #DADADA;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error-msg {
      display: none;
      position: absolute;
      bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #fee; border: 1px solid #fcc;
      color: #900; padding: 10px 16px;
      border-radius: 6px; font-size: 13px;
      max-width: 480px; text-align: center;
      z-index: 20;
    }
  </style>
</head>
<body>

<aside>
  <div class="logo">
    <span><span aria-hidden="true">&#9646;</span> Sudata</span>
  </div>
  <div class="section-label">Reportes</div>
  <ul id="report-list">
    <li><a><em style="color:var(--text-muted);font-size:12px">Cargando…</em></a></li>
  </ul>
  <div class="sidebar-footer">Powered by Sudata</div>
</aside>

<main>
  <header>
    <h1>Reportes Power BI</h1>
    <span id="report-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="12" width="4" height="10"/><rect x="10" y="6" width="4" height="16"/><rect x="18" y="2" width="4" height="20"/></svg>
      <span id="badge-text"></span>
    </span>
    <!-- Se muestran segun cfg.actions que devuelve /report-config -->
    <div id="actions">
      <button type="button" class="action-btn" id="btn-reset" hidden
              title="Restablece los filtros, segmentaciones y otros cambios de vista">Restablecer</button>
      <button type="button" class="action-btn" id="btn-refresh" hidden
              title="Actualiza los objetos visuales con los datos mas recientes">Actualizar visuales</button>
    </div>
  </header>

  <div id="filter-bar">
    <label for="filter-input">Filtro:</label>
    <input type="text" id="filter-input" placeholder="Ej: USA" />
    <button id="filter-btn">Aplicar</button>
  </div>

  <div id="report-container">
    <div class="placeholder" id="placeholder">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="#DADADA"><rect x="2" y="12" width="4" height="10"/><rect x="10" y="6" width="4" height="16"/><rect x="18" y="2" width="4" height="20"/></svg>
      Seleccioná un reporte del menú lateral
    </div>
    <div class="spinner-wrap" id="spinner">
      <div class="spinner"></div>
      Cargando reporte…
    </div>
    <div id="error-msg"></div>
    <div id="info-msg"></div>
  </div>
</main>

<script>
  const models = window['powerbi-client']?.models;
  let currentReport = null;
  let currentReportId = null;
  let currentReportName = null;
  let currentFilterable = false;

  const spinner = document.getElementById('spinner');
  const errorMsg = document.getElementById('error-msg');
  const placeholder = document.getElementById('placeholder');
  const filterBar = document.getElementById('filter-bar');
  const filterInput = document.getElementById('filter-input');
  const badgeText = document.getElementById('badge-text');
  const reportBadge = document.getElementById('report-badge');
  const actionsBar = document.getElementById('actions');
  const btnReset = document.getElementById('btn-reset');
  const btnRefresh = document.getElementById('btn-refresh');
  const infoMsg = document.getElementById('info-msg');

  /** Muestra u oculta los botones segun cfg.actions (viene de /report-config). */
  function setActions(actions) {
    const a = actions || {};
    btnReset.hidden = !a.resetToDefault;
    btnRefresh.hidden = !a.refreshVisuals;
    actionsBar.classList.toggle('show', !!(a.resetToDefault || a.refreshVisuals));
  }

  function showInfo(msg) {
    infoMsg.textContent = msg;
    infoMsg.style.display = 'block';
    setTimeout(() => { infoMsg.style.display = 'none'; }, 3000);
  }

  /**
   * Ejecuta una accion del SDK sobre el reporte actual, avisa el resultado y lo registra en la consola
   * del navegador (F12 > Consola): lo que devolvio el SDK, cuanto tardo y el error completo si fallo.
   */
  async function runAction(btn, name, doAction, okMsg) {
    if (!currentReport) return;
    btn.disabled = true;
    errorMsg.style.display = 'none';
    const started = Date.now();
    console.log(`[${name}] solicitado, reporte ${currentReportId} (${currentReportName})`);
    try {
      const result = await doAction(currentReport);
      console.log(`[${name}] respuesta en ${Date.now() - started} ms:`,
        result === undefined ? '(sin cuerpo: la promesa se resolvio correctamente)' : result);
      showInfo(okMsg);
    } catch (e) {
      console.error(`[${name}] error en ${Date.now() - started} ms:`, e);
      errorMsg.textContent = 'No se pudo completar la accion: ' + (e?.detail?.message || e?.message || JSON.stringify(e));
      errorMsg.style.display = 'block';
    } finally {
      btn.disabled = false;
    }
  }

  // Restablecer: requiere settings.persistentFiltersEnabled = true al cargar (viene en cfg.settings)
  btnReset.addEventListener('click', () =>
    runAction(btnReset, 'resetPersistentFilters', r => r.resetPersistentFilters(),
              'Se restablecieron los valores predeterminados'));
  // Actualizar visuales: report.refresh(); segun Microsoft solo trae datos nuevos en modelos DirectQuery
  btnRefresh.addEventListener('click', () =>
    runAction(btnRefresh, 'refresh', r => r.refresh(), 'Objetos visuales actualizados'));

  // Cargar lista de reportes
  fetch('/api/reports')
    .then(r => r.json())
    .then(data => {
      const ul = document.getElementById('report-list');
      ul.innerHTML = '';
      data.reports.forEach(rep => {
        const li = document.createElement('li');
        li.innerHTML = `<a>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="12" width="4" height="10"/><rect x="10" y="6" width="4" height="16"/><rect x="18" y="2" width="4" height="20"/>
          </svg>
          ${rep.name}
        </a>`;
        li.querySelector('a').onclick = () => selectReport(rep.id, rep.name, !!rep.filterable, li);
        ul.appendChild(li);
      });
    })
    .catch(() => {
      document.getElementById('report-list').innerHTML =
        '<li><a style="color:#e55">Error al cargar reportes</a></li>';
    });

  // Aplicar filtro
  document.getElementById('filter-btn').addEventListener('click', () => {
    if (currentReportId !== null) embedReport();
  });
  filterInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('filter-btn').click();
  });

  /**
   * Selecciona un reporte del sidebar.
   * - Si es filtrable: muestra la barra de filtro y espera a que se aplique.
   * - Si no es filtrable: inicia el embed inmediatamente.
   */
  function selectReport(id, name, filterable, liEl) {
    currentReportId = id;
    currentReportName = name;
    currentFilterable = filterable;

    // Marcar activo
    document.querySelectorAll('#report-list li').forEach(l => l.classList.remove('active'));
    if (liEl) liEl.classList.add('active');

    // Badge
    badgeText.textContent = name;
    reportBadge.classList.add('show');

    // Barra de filtro
    if (filterable) {
      filterBar.classList.add('show');
      filterInput.value = '';
      // Limpiar reporte anterior y mostrar placeholder
      resetEmbed();
      showPlaceholder('Ingresá un filtro y hacé clic en Aplicar');
    } else {
      filterBar.classList.remove('show');
      filterInput.value = '';
      embedReport();
    }
  }

  /** Elimina el embed anterior. */
  function resetEmbed() {
    if (currentReport) {
      const pbiDiv = document.getElementById('pbi-embed');
      if (pbiDiv) powerbi.reset(pbiDiv);
      currentReport = null;
    }
    errorMsg.style.display = 'none';
    spinner.classList.remove('show');
    setActions(null);
  }

  function showPlaceholder(msg) {
    placeholder.innerHTML = `
      <svg width="64" height="64" viewBox="0 0 24 24" fill="#DADADA">
        <rect x="2" y="12" width="4" height="10"/><rect x="10" y="6" width="4" height="16"/><rect x="18" y="2" width="4" height="20"/>
      </svg>
      ${msg}`;
    placeholder.style.display = 'flex';
  }

  /** Obtiene el token de embed y renderiza el reporte. Siempre crea un div limpio. */
  function embedReport() {
    if (currentReportId === null) return;

    errorMsg.style.display = 'none';
    placeholder.style.display = 'none';
    setActions(null);

    // Recrear el div de embed para garantizar un contenedor limpio
    const container = document.getElementById('report-container');
    let pbiDiv = document.getElementById('pbi-embed');
    if (pbiDiv) {
      pbiDiv.remove();
    }
    currentReport = null;
    pbiDiv = document.createElement('div');
    pbiDiv.id = 'pbi-embed';
    pbiDiv.style.cssText = 'position:absolute;inset:0;';
    container.appendChild(pbiDiv);

    spinner.classList.add('show');

    const filterValue = currentFilterable ? filterInput.value.trim() : '';
    const params = new URLSearchParams({ report_id: currentReportId });
    if (filterValue) params.set('filter', filterValue);

    fetch(`/api/report-config?${params}`)
      .then(r => r.json())
      .then(cfg => {
        const config = {
          type: 'report',
          tokenType: models?.TokenType?.Aad ?? 0,
          accessToken: cfg.accessToken,
          embedUrl: cfg.embedUrl,
          id: cfg.reportId,
          settings: {
            panes: { filters: { visible: false }, pageNavigation: { visible: true } },
            bars: { statusBar: { visible: true } },
            // persistentFiltersEnabled solo puede definirse al cargar; "Restablecer" lo necesita
            ...(cfg.settings || {})
          }
        };
        currentReport = powerbi.embed(pbiDiv, config);
        currentReport.on('loaded', () => {
          spinner.classList.remove('show');
          setActions(cfg.actions);
        });
        currentReport.on('error', e => {
          spinner.classList.remove('show');
          errorMsg.textContent = 'Error: ' + (e.detail?.message || JSON.stringify(e.detail));
          errorMsg.style.display = 'block';
        });
      })
      .catch(err => {
        spinner.classList.remove('show');
        errorMsg.textContent = 'Error al obtener configuración: ' + err.message;
        errorMsg.style.display = 'block';
      });
  }
</script>
</body>
</html>
